<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>浏览器语音转文字</title>
    <style>
        body{padding:30px;font-size:16px;}
        #result{width:100%;height:200px;margin:15px 0;padding:10px;border:1px solid #ccc;}
        button{padding:8px 20px;cursor:pointer;}
    </style>
</head>
<body>
    <button id="startBtn">开始语音识别</button>
    <button id="stopBtn">停止识别</button>
    <textarea id="result" placeholder="语音文字会自动显示在这里..."></textarea>

    <script>
        // 兼容浏览器
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        // 设置中文识别
        recognition.lang = 'zh-CN';
        recognition.continuous = true; // 连续识别
        recognition.interimResults = true; // 实时显示临时结果

        const resultText = document.getElementById('result');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // 开始识别
        startBtn.onclick = () => {
            recognition.start();
            resultText.value = '';
        };

        // 停止识别
        stopBtn.onclick = () => {
            recognition.stop();
        };

        // 识别结果回调
        recognition.onresult = (e) => {
            let text = '';
            for(let i = e.resultIndex; i < e.results.length; i++){
                text += e.results[i][0].transcript;
            }
            resultText.value = text;
        };

        // 报错提示
        recognition.onerror = (err) => {
            alert('识别出错：' + err.message);
        };
    </script>
</body>
</html>
